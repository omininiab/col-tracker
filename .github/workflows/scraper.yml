name: Monthly Price Scraper

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scraper.yml'
      - 'scraper.py'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/prices.json'
  schedule:
    - cron: '17 14 1 * *'
  workflow_dispatch:

concurrency:
  group: tracker-update-and-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install crawler dependencies
        run: python -m pip install requests

      - name: Run crawler
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated data update: $(date -u +'%Y-%m-%d')"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site artifact
        run: |
          mkdir -p _site/css _site/js _site/data
          cp index.html _site/index.html
          cp css/style.css _site/css/style.css
          cp js/app.js _site/js/app.js
          cp data/prices.json _site/data/prices.json

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
